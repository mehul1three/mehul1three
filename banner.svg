<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="mehul1three - Mehul Kale, CSE student">
  <defs>
    <pattern id="bgstripes" width="120" height="300" patternUnits="userSpaceOnUse">
      <rect x="0"   width="40" height="300" fill="#0a1120"/>
      <rect x="40"  width="40" height="300" fill="#0d1729"/>
      <rect x="80"  width="20" height="300" fill="#120d19"/>
      <rect x="100" width="20" height="300" fill="#0a1120"/>
    </pattern>

    <linearGradient id="blaugrana" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c1123f"/>
      <stop offset="44%"  stop-color="#a50044"/>
      <stop offset="56%"  stop-color="#12468f"/>
      <stop offset="100%" stop-color="#2a63c4"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c1123f"/>
      <stop offset="100%" stop-color="#2a63c4"/>
    </linearGradient>

    <radialGradient id="glow1">
      <stop offset="0%"   stop-color="#d67390" stop-opacity="0.60"/>
      <stop offset="55%"  stop-color="#b90d40" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b90d40" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2">
      <stop offset="0%"   stop-color="#cf6e92" stop-opacity="0.60"/>
      <stop offset="55%"  stop-color="#ad0543" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ad0543" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow3">
      <stop offset="0%"   stop-color="#a07fa8" stop-opacity="0.60"/>
      <stop offset="55%"  stop-color="#5c2369" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#5c2369" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow4">
      <stop offset="0%"   stop-color="#7a98c7" stop-opacity="0.60"/>
      <stop offset="55%"  stop-color="#194e9f" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#194e9f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow5">
      <stop offset="0%"   stop-color="#7fa0d4" stop-opacity="0.60"/>
      <stop offset="55%"  stop-color="#235bb5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#235bb5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1e27"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </linearGradient>

    <linearGradient id="hem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7a1f3d"/>
      <stop offset="50%"  stop-color="#3c2540"/>
      <stop offset="100%" stop-color="#16264a"/>
    </linearGradient>

    <style>
      .lamp { animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: linear; opacity: 0; }
      .c1 { animation-name: L1; }
      .c2 { animation-name: L2; }
      .c3 { animation-name: L3; }
      .c4 { animation-name: L4; }
      .c5 { animation-name: L5; }

      /* 6s loop: a lamp every 0.4s, brief hold, lights out at 3s, card holds ~2.4s */
      @keyframes L1 { 0%,8.0%  {opacity:0} 8.3%,49.6%  {opacity:1} 50%,100% {opacity:0} }
      @keyframes L2 { 0%,14.7% {opacity:0} 15.0%,49.6% {opacity:1} 50%,100% {opacity:0} }
      @keyframes L3 { 0%,21.4% {opacity:0} 21.7%,49.6% {opacity:1} 50%,100% {opacity:0} }
      @keyframes L4 { 0%,28.0% {opacity:0} 28.3%,49.6% {opacity:1} 50%,100% {opacity:0} }
      @keyframes L5 { 0%,34.7% {opacity:0} 35.0%,49.6% {opacity:1} 50%,100% {opacity:0} }

      .reveal { opacity: 0; animation: reveal 6s infinite cubic-bezier(.2,.7,.3,1); }
      @keyframes reveal {
        0%, 50%      { opacity: 0; transform: translateY(10px); }
        58.3%, 90%   { opacity: 1; transform: translateY(0); }
        95%, 100%    { opacity: 0; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .lamp, .reveal { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bgstripes)"/>

  <rect x="0" y="58" width="1200" height="10" fill="#2b323f"/>
  <rect x="0" y="58" width="1200" height="2" fill="#3a4354"/>

  <g>
    <g transform="translate(350,0)">
      <rect x="0" y="110" width="92" height="82" rx="9" fill="#08090d"/>
      <circle cx="46" cy="131" r="17" fill="#2f3641"/>
      <circle cx="46" cy="172" r="17" fill="#2f3641"/>
      <circle class="lamp c1" cx="46" cy="131" r="30" fill="url(#glow1)"/>
      <circle class="lamp c1" cx="46" cy="172" r="30" fill="url(#glow1)"/>
      <circle class="lamp c1" cx="46" cy="131" r="17" fill="#b90d40"/>
      <circle class="lamp c1" cx="46" cy="172" r="17" fill="#b90d40"/>
    </g>
    <g transform="translate(452,0)">
      <rect x="0" y="110" width="92" height="82" rx="9" fill="#08090d"/>
      <circle cx="46" cy="131" r="17" fill="#2f3641"/>
      <circle cx="46" cy="172" r="17" fill="#2f3641"/>
      <circle class="lamp c2" cx="46" cy="131" r="30" fill="url(#glow2)"/>
      <circle class="lamp c2" cx="46" cy="172" r="30" fill="url(#glow2)"/>
      <circle class="lamp c2" cx="46" cy="131" r="17" fill="#ad0543"/>
      <circle class="lamp c2" cx="46" cy="172" r="17" fill="#ad0543"/>
    </g>
    <g transform="translate(554,0)">
      <rect x="0" y="110" width="92" height="82" rx="9" fill="#08090d"/>
      <circle cx="46" cy="131" r="17" fill="#2f3641"/>
      <circle cx="46" cy="172" r="17" fill="#2f3641"/>
      <circle class="lamp c3" cx="46" cy="131" r="30" fill="url(#glow3)"/>
      <circle class="lamp c3" cx="46" cy="172" r="30" fill="url(#glow3)"/>
      <circle class="lamp c3" cx="46" cy="131" r="17" fill="#5c2369"/>
      <circle class="lamp c3" cx="46" cy="172" r="17" fill="#5c2369"/>
    </g>
    <g transform="translate(656,0)">
      <rect x="0" y="110" width="92" height="82" rx="9" fill="#08090d"/>
      <circle cx="46" cy="131" r="17" fill="#2f3641"/>
      <circle cx="46" cy="172" r="17" fill="#2f3641"/>
      <circle class="lamp c4" cx="46" cy="131" r="30" fill="url(#glow4)"/>
      <circle class="lamp c4" cx="46" cy="172" r="30" fill="url(#glow4)"/>
      <circle class="lamp c4" cx="46" cy="131" r="17" fill="#194e9f"/>
      <circle class="lamp c4" cx="46" cy="172" r="17" fill="#194e9f"/>
    </g>
    <g transform="translate(758,0)">
      <rect x="0" y="110" width="92" height="82" rx="9" fill="#08090d"/>
      <circle cx="46" cy="131" r="17" fill="#2f3641"/>
      <circle cx="46" cy="172" r="17" fill="#2f3641"/>
      <circle class="lamp c5" cx="46" cy="131" r="30" fill="url(#glow5)"/>
      <circle class="lamp c5" cx="46" cy="172" r="30" fill="url(#glow5)"/>
      <circle class="lamp c5" cx="46" cy="131" r="17" fill="#235bb5"/>
      <circle class="lamp c5" cx="46" cy="172" r="17" fill="#235bb5"/>
    </g>
  </g>

  <rect x="330" y="22" width="540" height="90" rx="14" fill="url(#housing)"/>

  <text x="600" y="80" text-anchor="middle" fill="url(#blaugrana)"
        font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
        font-size="42" font-weight="700" letter-spacing="5">mehul1three</text>

  <g class="reveal" font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace">
    <rect x="330" y="212" width="540" height="76" rx="12" fill="#0e1422" stroke="#2b3446" stroke-width="1.5"/>
    <rect x="348" y="226" width="3" height="48" rx="1.5" fill="url(#accent)"/>

    <text x="366" y="249" fill="#e9dcc0" font-size="25" font-weight="700" letter-spacing="2">Mehul Kale</text>
    <text x="366" y="273" fill="#9fb0cc" font-size="14" letter-spacing="1">CSE student &#183; compilers, systems, interfaces</text>
    <text x="852" y="246" text-anchor="end" fill="#7d8ba6" font-size="12.5" letter-spacing="1">Open to internships</text>
  </g>

  <rect x="0" y="294" width="1200" height="6" fill="url(#hem)"/>
</svg>
