<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="mehul1three - mehul kale, cse student">
  <defs>
    <!-- dark blaugrana-tinted backdrop -->
    <pattern id="bgstripes" width="120" height="560" patternUnits="userSpaceOnUse">
      <rect x="0"   width="40" height="560" fill="#0a1120"/>
      <rect x="40"  width="40" height="560" fill="#0d1729"/>
      <rect x="80"  width="20" height="560" fill="#120d19"/>
      <rect x="100" width="20" height="560" fill="#0a1120"/>
    </pattern>

    <!-- wordmark: garnet into blue -->
    <linearGradient id="blaugrana" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c1123f"/>
      <stop offset="44%"  stop-color="#a50044"/>
      <stop offset="56%"  stop-color="#12468f"/>
      <stop offset="100%" stop-color="#2a63c4"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c1123f"/>
      <stop offset="100%" stop-color="#2a63c4"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%"   stop-color="#d4145a" stop-opacity="0.60"/>
      <stop offset="55%"  stop-color="#a50044" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#a50044" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1e27"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </linearGradient>

    <linearGradient id="hem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7a1f3d"/>
      <stop offset="50%"  stop-color="#3c2540"/>
      <stop offset="100%" stop-color="#16264a"/>
    </linearGradient>

    <style>
      .lamp { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; opacity: 0; }
      .c1 { animation-name: L1; }
      .c2 { animation-name: L2; }
      .c3 { animation-name: L3; }
      .c4 { animation-name: L4; }
      .c5 { animation-name: L5; }

      /* one lamp arms per second, all hold, then lights out at 6.5s */
      @keyframes L1 { 0%,8.2%  {opacity:0} 8.4%,54.1%  {opacity:1} 54.3%,100% {opacity:0} }
      @keyframes L2 { 0%,16.5% {opacity:0} 16.7%,54.1% {opacity:1} 54.3%,100% {opacity:0} }
      @keyframes L3 { 0%,24.8% {opacity:0} 25.0%,54.1% {opacity:1} 54.3%,100% {opacity:0} }
      @keyframes L4 { 0%,33.1% {opacity:0} 33.3%,54.1% {opacity:1} 54.3%,100% {opacity:0} }
      @keyframes L5 { 0%,41.5% {opacity:0} 41.7%,54.1% {opacity:1} 54.3%,100% {opacity:0} }

      /* card rises the moment the lights go out, holds ~4s */
      .reveal {
        opacity: 0;
        animation: reveal 12s infinite cubic-bezier(.2,.7,.3,1);
      }
      @keyframes reveal {
        0%, 54.3%   { opacity: 0; transform: translateY(16px); }
        59.2%, 87.5% { opacity: 1; transform: translateY(0); }
        91.7%, 100%  { opacity: 0; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .lamp, .reveal { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="560" fill="url(#bgstripes)"/>

  <!-- gantry beam, behind the housing -->
  <rect x="0" y="105" width="1200" height="14" fill="#2b323f"/>
  <rect x="0" y="105" width="1200" height="3" fill="#3a4354"/>

  <!-- light pods, drawn under the housing so they read as attached -->
  <g>
    <g transform="translate(301,0)">
      <rect x="0" y="205" width="110" height="165" rx="12" fill="#08090d"/>
      <circle cx="55" cy="253" r="34" fill="#2f3641"/>
      <circle cx="55" cy="327" r="34" fill="#2f3641"/>
      <circle class="lamp c1" cx="55" cy="253" r="56" fill="url(#glow)"/>
      <circle class="lamp c1" cx="55" cy="327" r="56" fill="url(#glow)"/>
      <circle class="lamp c1" cx="55" cy="253" r="34" fill="#a50044"/>
      <circle class="lamp c1" cx="55" cy="327" r="34" fill="#a50044"/>
    </g>
    <g transform="translate(423,0)">
      <rect x="0" y="205" width="110" height="165" rx="12" fill="#08090d"/>
      <circle cx="55" cy="253" r="34" fill="#2f3641"/>
      <circle cx="55" cy="327" r="34" fill="#2f3641"/>
      <circle class="lamp c2" cx="55" cy="253" r="56" fill="url(#glow)"/>
      <circle class="lamp c2" cx="55" cy="327" r="56" fill="url(#glow)"/>
      <circle class="lamp c2" cx="55" cy="253" r="34" fill="#a50044"/>
      <circle class="lamp c2" cx="55" cy="327" r="34" fill="#a50044"/>
    </g>
    <g transform="translate(545,0)">
      <rect x="0" y="205" width="110" height="165" rx="12" fill="#08090d"/>
      <circle cx="55" cy="253" r="34" fill="#2f3641"/>
      <circle cx="55" cy="327" r="34" fill="#2f3641"/>
      <circle class="lamp c3" cx="55" cy="253" r="56" fill="url(#glow)"/>
      <circle class="lamp c3" cx="55" cy="327" r="56" fill="url(#glow)"/>
      <circle class="lamp c3" cx="55" cy="253" r="34" fill="#a50044"/>
      <circle class="lamp c3" cx="55" cy="327" r="34" fill="#a50044"/>
    </g>
    <g transform="translate(667,0)">
      <rect x="0" y="205" width="110" height="165" rx="12" fill="#08090d"/>
      <circle cx="55" cy="253" r="34" fill="#2f3641"/>
      <circle cx="55" cy="327" r="34" fill="#2f3641"/>
      <circle class="lamp c4" cx="55" cy="253" r="56" fill="url(#glow)"/>
      <circle class="lamp c4" cx="55" cy="327" r="56" fill="url(#glow)"/>
      <circle class="lamp c4" cx="55" cy="253" r="34" fill="#a50044"/>
      <circle class="lamp c4" cx="55" cy="327" r="34" fill="#a50044"/>
    </g>
    <g transform="translate(789,0)">
      <rect x="0" y="205" width="110" height="165" rx="12" fill="#08090d"/>
      <circle cx="55" cy="253" r="34" fill="#2f3641"/>
      <circle cx="55" cy="327" r="34" fill="#2f3641"/>
      <circle class="lamp c5" cx="55" cy="253" r="56" fill="url(#glow)"/>
      <circle class="lamp c5" cx="55" cy="327" r="56" fill="url(#glow)"/>
      <circle class="lamp c5" cx="55" cy="253" r="34" fill="#a50044"/>
      <circle class="lamp c5" cx="55" cy="327" r="34" fill="#a50044"/>
    </g>
  </g>

  <!-- housing -->
  <rect x="290" y="45" width="620" height="165" rx="20" fill="url(#housing)"/>

  <text x="600" y="148" text-anchor="middle" fill="url(#blaugrana)"
        font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
        font-size="58" font-weight="700" letter-spacing="8">mehul1three</text>

  <!-- detail card, revealed on lights out -->
  <g class="reveal" font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace">
    <rect x="290" y="398" width="620" height="108" rx="14" fill="#0e1422" stroke="#2b3446" stroke-width="1.5"/>
    <rect x="312" y="418" width="4" height="70" rx="2" fill="url(#accent)"/>

    <text x="334" y="448" fill="#e9dcc0" font-size="34" font-weight="700" letter-spacing="3">mehul kale</text>
    <text x="334" y="481" fill="#9fb0cc" font-size="17" letter-spacing="1.5">cse student &#183; compilers, systems, interfaces</text>
    <text x="886" y="444" text-anchor="end" fill="#7d8ba6" font-size="15" letter-spacing="1.5">open to internships</text>
  </g>

  <rect x="0" y="555" width="1200" height="5" fill="url(#hem)"/>
</svg>
